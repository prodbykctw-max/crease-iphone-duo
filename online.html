<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREASE · Play Air Hockey Online, Free</title>
<meta name="description" content="Play CREASE online free — neon air hockey against another person in your browser. Tap QUICK MATCH to be paired with whoever is looking for a game, or share a room code to play a friend. No download, no account.">
<link rel="canonical" href="https://prodbykctw-max.github.io/crease-iphone-duo/online.html">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<meta property="og:title" content="CREASE · Play Air Hockey Online, Free">
<meta property="og:description" content="Play CREASE online free — neon air hockey against another person in your browser. Tap QUICK MATCH to be paired with whoever is looking for a game, or share a room code to play a friend. No download, no account.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://prodbykctw-max.github.io/crease-iphone-duo/online.html">

<style>
*{box-sizing:border-box}body{margin:0;background:#090411;color:#f6eaff;font:16px system-ui;text-align:center}
main{max-width:480px;margin:auto;padding:20px}
h1{letter-spacing:.2em;color:#2de2e6;margin:.2em 0}
button,input,a{font:inherit;border-radius:12px;padding:14px;margin:6px;border:1px solid #72409e;background:#1c0c30;color:white}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
#quick{background:#2de2e6;color:#0b0618;border-color:#2de2e6;font-weight:700;letter-spacing:.08em;width:90%}
input{width:90%;text-transform:uppercase;letter-spacing:.18em;text-align:center}
canvas{display:block;width:min(90vw,400px);height:auto;margin:auto;touch-action:none;background:#10071c;border-radius:18px}
p{color:#bfadd7}a{display:inline-block;text-decoration:none}
#status{min-height:3em}#score{font-size:30px;color:#2de2e6}
small{display:block;color:#bfadd7}
.or{color:#6d5f87;font-size:13px;letter-spacing:.2em;margin:14px 0 2px}
.row{display:flex;gap:4px;justify-content:center;align-items:center}
.row input{flex:1;margin-right:0}.row button{flex:0 0 auto}
</style><main><h1>CREASE</h1><p>First to seven, live against another player</p>
<section id="lobby">
  <button id="quick">QUICK MATCH</button>
  <small>Pairs you with anyone else looking for a game.</small>
  <p class="or">OR PLAY A FRIEND</p>
  <div class="row"><input id="code" aria-label="Room code" placeholder="ROOM CODE" maxlength="10"><button id="join">JOIN</button></div>
  <button id="create">CREATE A ROOM</button>
</section>
<p id="status" role="status">Connecting…</p>
<button id="cancel" hidden>CANCEL</button>
<button id="copy" hidden>COPY INVITE LINK</button>
<div id="score">0 : 0</div>
<canvas id="table" width="600" height="1080" aria-label="Online game table"></canvas>
<small>You always play from the bottom. Drag your paddle.</small>
<button id="leave" hidden>LEAVE MATCH</button>
<a href="index.html">BACK TO CREASE</a></main>
<script src="online-config.js"></script><script type="module">
const $=id=>document.getElementById(id),ctx=$('table').getContext('2d');
let ws=null,player=0,state=null,lastSend=0,room='',searching=false,tries=0;
const endpoint=window.CREASE_ONLINE_URL;
const lobbyButtons=['quick','create','join'];
const setLobby=on=>lobbyButtons.forEach(id=>{$(id).disabled=!on;});

if(!endpoint){
  $('status').textContent='Online play is not switched on yet. Local play is available in CREASE.';
  setLobby(false);
}else $('status').textContent='Tap QUICK MATCH, or use a room code to play a specific person.';

const initialCode=new URL(location.href).searchParams.get('room');
if(initialCode){$('code').value=initialCode.toUpperCase();}

function connect(code,create){
  if(ws){try{ws.close();}catch{}}
  room=code;
  const url=new URL('/room/'+room,endpoint);
  url.protocol=url.protocol==='https:'?'wss:':'ws:';
  if(create)url.searchParams.set('create','1');
  state=null;ws=new WebSocket(url);
  setLobby(false);$('cancel').hidden=false;
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch{return;}
    if(m.type==='joined'){
      player=m.player;
      $('status').textContent=player===0
        ?(searching?'Looking for an opponent…':'Room '+room+' · waiting for your friend')
        :'Opponent found · starting';
      $('copy').hidden=searching;$('leave').hidden=false;
    }
    if(m.type==='ready'){searching=false;tries=0;$('status').textContent='Opponent found · starting';$('cancel').hidden=true;$('copy').hidden=true;}
    if(m.type==='state'){
      state=m.state;
      $('status').textContent=state.winner?(state.winner===player+1?'YOU WIN':'OPPONENT WINS')
        :state.countdown>0?'Get ready…':'Match live';
      $('score').textContent=state.score[player]+' : '+state.score[1-player];
    }
  };
  ws.onclose=()=>{
    $('copy').hidden=$('leave').hidden=true;
    if(searching&&tries<6){$('status').textContent='Still looking…';setTimeout(findMatch,400);return;}
    searching=false;$('cancel').hidden=true;setLobby(true);
    $('status').textContent='Match ended. Start another when you are ready.';
  };
  ws.onerror=()=>{if(!searching)$('status').textContent='Could not connect. Check the code and try again.';};
}

// Quick match: ask the lobby who is waiting. If that room has already gone
// (the host closed their tab), the socket closes and we simply ask again.
async function findMatch(){
  tries++;
  if(tries>6){searching=false;$('cancel').hidden=true;setLobby(true);
    $('status').textContent='Nobody is around right now. Try again, or send a friend a room code.';return;}
  $('status').textContent=tries===1?'Looking for an opponent…':'Still looking…';
  try{
    const res=await fetch(new URL('/match',endpoint),{headers:{'accept':'application/json'}});
    if(!res.ok)throw new Error('lobby '+res.status);
    const {code,create}=await res.json();
    connect(code,create);
  }catch(err){
    searching=false;$('cancel').hidden=true;setLobby(true);
    $('status').textContent='Could not reach the match server.';
  }
}

$('quick').onclick=()=>{searching=true;tries=0;$('copy').hidden=true;findMatch();};
$('create').onclick=()=>{
  searching=false;tries=0;
  const code=Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');
  connect(code,true);
};
$('join').onclick=()=>{
  searching=false;tries=0;
  const code=$('code').value.toUpperCase().trim();
  if(!/^[A-Z2-9]{10}$/.test(code)){$('status').textContent='A room code is ten letters and numbers.';return;}
  connect(code,false);
};
$('cancel').onclick=()=>{searching=false;tries=99;if(ws){try{ws.close();}catch{}}
  $('cancel').hidden=true;setLobby(true);$('status').textContent='Stopped looking.';};
$('leave').onclick=()=>{searching=false;if(ws){try{ws.close();}catch{}}};
$('copy').onclick=async()=>{
  const url=new URL(location.href);url.searchParams.set('room',room);
  try{await navigator.clipboard.writeText(url.href);$('status').textContent='Invite copied · send it to your friend.';}
  catch{$('status').textContent='Share this room code: '+room;}
};

function input(e){
  if(!ws||ws.readyState!==1||!state)return;
  const now=performance.now();if(now-lastSend<30)return;lastSend=now;
  const r=$('table').getBoundingClientRect();
  let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height*1.8;
  if(player===1){x=1-x;y=1.8-y;}
  ws.send(JSON.stringify({type:'move',x,y}));
}
$('table').onpointerdown=e=>{$('table').setPointerCapture(e.pointerId);input(e);};
$('table').onpointermove=e=>{if(e.buttons||e.pointerType==='touch')input(e);};

function draw(){
  ctx.clearRect(0,0,600,1080);ctx.save();ctx.scale(600,600);ctx.lineWidth=.002;ctx.strokeStyle='#42204d';
  for(let i=0;i<=18;i++){ctx.beginPath();ctx.moveTo(0,i*.1);ctx.lineTo(1,i*.1);ctx.stroke();}
  for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(i*.1,0);ctx.lineTo(i*.1,1.8);ctx.stroke();}
  ctx.strokeStyle='#d942bc';ctx.beginPath();ctx.moveTo(0,.9);ctx.lineTo(1,.9);ctx.stroke();
  if(state){
    if(player===1){ctx.translate(1,1.8);ctx.rotate(Math.PI);}
    for(let i=0;i<2;i++){const p=state.paddles[i];ctx.fillStyle=i===player?'#2de2e6':'#ff2589';
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,.065,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(state.puck.x,state.puck.y,.025,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();requestAnimationFrame(draw);
}
draw();
// Test hook: lets an automated run read what a real player would see.
window.__online={get state(){return state;},get player(){return player;},get room(){return room;},
  get status(){return $('status').textContent;},get connected(){return !!ws&&ws.readyState===1;}};
</script></html>
