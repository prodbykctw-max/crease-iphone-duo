<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREASE · Play a friend</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090411;color:#f6eaff;font:16px system-ui;text-align:center}main{max-width:480px;margin:auto;padding:20px}h1{letter-spacing:.2em;color:#2de2e6}button,input,a{font:inherit;border-radius:12px;padding:14px;margin:6px;border:1px solid #72409e;background:#1c0c30;color:white}button{cursor:pointer}button:disabled{opacity:.4}input{width:90%;text-transform:uppercase}canvas{display:block;width:min(90vw,400px);height:auto;margin:auto;touch-action:none;background:#10071c;border-radius:18px}p{color:#bfadd7}a{display:inline-block;text-decoration:none}#status{min-height:3em}#score{font-size:30px;color:#2de2e6}small{display:block;color:#bfadd7}
</style><main><h1>CREASE</h1><p>Online friend match · first to seven</p><section id="lobby"><button id="create">CREATE ROOM</button><input id="code" aria-label="Room code" placeholder="Friend’s room code" maxlength="10"><button id="join">JOIN ROOM</button></section><p id="status" role="status">Connecting…</p><button id="copy" hidden>COPY INVITE LINK</button><div id="score">0 : 0</div><canvas id="table" width="600" height="1080" aria-label="Online game table"></canvas><small>You always play from the bottom. Drag your paddle.</small><button id="leave" hidden>LEAVE MATCH</button><a href="index.html">BACK TO CREASE</a></main><script src="online-config.js"></script><script type="module">
const $=id=>document.getElementById(id),ctx=$('table').getContext('2d');let ws=null,player=0,state=null,lastSend=0,room='';
const endpoint=window.CREASE_ONLINE_URL;
if(!endpoint){$('status').textContent='Online matches are coming soon. Local play is available in CREASE.';$('create').disabled=$('join').disabled=true;}else $('status').textContent='Create a room or enter your friend’s code.';
const initialCode=new URL(location.href).searchParams.get('room');if(initialCode)$('code').value=initialCode;
function connect(create){
  if(ws)ws.close();room=create?Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join(''):$('code').value.toUpperCase().trim();
  if(!/^[A-Z2-9]{10}$/.test(room)){$('status').textContent='Enter a ten-character room code.';return;}
  const url=new URL('/room/'+room,endpoint);url.protocol=url.protocol==='https:'?'wss:':'ws:';if(create)url.searchParams.set('create','1');
  state=null;ws=new WebSocket(url);$('status').textContent='Connecting…';$('create').disabled=$('join').disabled=true;
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){player=m.player;$('status').textContent=player===0?'Room '+room+' · waiting for your friend':'Joined · match starting';$('copy').hidden=false;$('leave').hidden=false;}if(m.type==='state'){state=m.state;$('status').textContent=state.winner?(state.winner===player+1?'YOU WIN':'YOUR FRIEND WINS'):state.countdown>0?'Get ready…':'Match live';$('score').textContent=state.score[player]+' : '+state.score[1-player];}};
  ws.onclose=()=>{$('status').textContent='Room closed. Create a new room to rematch.';$('create').disabled=$('join').disabled=false;$('copy').hidden=$('leave').hidden=true;};
  ws.onerror=()=>{$('status').textContent='Could not connect. Check the room code and try again.';};
}
$('create').onclick=()=>connect(true);$('join').onclick=()=>connect(false);$('leave').onclick=()=>ws?.close();
$('copy').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('room',room);try{await navigator.clipboard.writeText(url.href);$('status').textContent='Invite copied · send it to your friend.';}catch{$('status').textContent='Share room code: '+room;}};
function input(e){if(!ws||ws.readyState!==1||!state)return;const now=performance.now();if(now-lastSend<30)return;lastSend=now;const r=$('table').getBoundingClientRect();let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height*1.8;if(player===1){x=1-x;y=1.8-y;}ws.send(JSON.stringify({type:'move',x,y}));}
$('table').onpointerdown=e=>{$('table').setPointerCapture(e.pointerId);input(e);};$('table').onpointermove=e=>{if(e.buttons||e.pointerType==='touch')input(e);};
function draw(){ctx.clearRect(0,0,600,1080);ctx.save();ctx.scale(600,600);ctx.lineWidth=.002;ctx.strokeStyle='#42204d';for(let i=0;i<=18;i++){ctx.beginPath();ctx.moveTo(0,i*.1);ctx.lineTo(1,i*.1);ctx.stroke();}for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(i*.1,0);ctx.lineTo(i*.1,1.8);ctx.stroke();}ctx.strokeStyle='#d942bc';ctx.beginPath();ctx.moveTo(0,.9);ctx.lineTo(1,.9);ctx.stroke();
  if(state){if(player===1){ctx.translate(1,1.8);ctx.rotate(Math.PI);}for(let i=0;i<2;i++){const p=state.paddles[i];ctx.fillStyle=i===player?'#2de2e6':'#ff2589';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,.065,0,Math.PI*2);ctx.fill();}ctx.fillStyle='white';ctx.beginPath();ctx.arc(state.puck.x,state.puck.y,.025,0,Math.PI*2);ctx.fill();}ctx.restore();requestAnimationFrame(draw);}draw();
</script></html>
