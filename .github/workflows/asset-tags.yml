name: Cache tags

# A changed asset served under an unchanged ?v= tag is invisible to every
# browser that already cached it. This fails the check instead of shipping a
# fix that returning players never receive.
#
# The same job checks the Content-Security-Policy script hashes (run after the
# cache-tag check, see tools/csp-hash.mjs): an inline script whose hash is stale
# is blocked by the browser. The tests job runs the unit tests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/stamp-assets.mjs --check
      - run: node tools/csp-hash.mjs --check
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.mjs
